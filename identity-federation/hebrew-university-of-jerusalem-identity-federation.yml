description: >-
  The Hebrew University of Jerusalem's SAML 2.0 identity federation surface — and the
  strongest institution-operated machine-readable contract found anywhere in this profile.
  Unlike the several Australian and UK institutions whose apparently self-hosted identity
  providers turn out to be managed federation tenancies terminating on cloud address space,
  this one survives the ownership check completely: the entityID host resolves inside the
  university's own legacy allocation on the Israeli academic network, and the metadata is
  signed with a key the university issued to itself, naming its own IT authority in the
  certificate subject.

  It is also the only surface in this profile that carries a dated operational risk, and the
  date is close: the signing certificate expires 2026-09-22, three weeks after this probe.

federation:
  national_network: ILAN — Israeli academic network
  operator: IUCC — Israel Inter-University Computation Center (MACHBA)
  autonomous_system: AS378 (MACHBA-AS)
  detail: >-
    Israeli higher education is networked through IUCC, which holds the 128.139.0.0/16 legacy
    allocation the university's hosts sit in. IUCC operates the national research network and
    the country's eduGAIN participation. Membership of an interfederation was NOT independently
    confirmed in this run: technical.edugain.org timed out on every request made on 2026-09-01,
    so no eduGAIN entity claim is recorded here. The identity provider below is evidenced
    directly from its own published metadata and needs no federation aggregate to stand up.
  edugain_entry_confirmed: false
  edugain_probe:
    url: https://technical.edugain.org/api.php
    status: 0
    note: Connection timed out after 25s on repeated attempts; unresolved, not negative.

