service_providers:
  - name: Hebrew University CRIS (Elsevier Pure) administrative surface
    entityID: https://cris.huji.ac.il/admin
    x-operator: tenant
    detail: >-
      An unauthenticated request to https://cris.huji.ac.il/admin/workspace.xhtml redirects to
      the university's own IdP with spentityid=https://cris.huji.ac.il/admin. The service is
      Elsevier's; the identity behind it is the university's. This is the clearest single piece
      of evidence that the IdP fronts the institution's real estate rather than being a
      standalone artifact.
    evidence:
