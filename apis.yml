apis:
  - aid: hebrew-university-of-jerusalem:library-discovery
    name: HUJI Library Discovery (Ex Libris Primo/Alma)
    description: >-
      The Hebrew University Library Authority runs its catalog and discovery
      on Ex Libris Primo/Alma (HUfind). Ex Libris provides standard Primo and
      Alma REST APIs and OAI-PMH publishing, but these are not exposed as a
      public, self-service developer program by HUJI and require
      institution-issued credentials. No public, documented HUJI-specific API
      endpoint or key signup was confirmed.
