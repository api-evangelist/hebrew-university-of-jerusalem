x-coverage:
  state: covered
  reason: covered
  detail: 'Two institution-operated surfaces were found, verified live, and confirmed HUJI-owned by IP
    ownership rather than by hostname: the Shnaton course catalog API at shnaton.huji.ac.il/api and the
    SAML 2.0 identity provider at idp.cc.huji.ac.il. Both resolve into RIPE inetnum 128.139.0.0/16 (ILAN,
    registrant IUCC) announced by AS378 MACHBA-AS, behind the university''s own F5 estate, with a GEANT
    TCS certificate issued to The Hebrew University of Jerusalem on the catalog host and a self-issued
    institutional certificate signing the IdP metadata. The course catalog is the substantive find: public,
    unauthenticated, bilingual, covering academic years 2020-2027, and completely undocumented — the university
    publishes no OpenAPI, no developer portal and no terms for it, so the contract in this repository
    is DERIVED by API Evangelist from the catalog''s own JavaScript client and then verified operation
    by operation against production. It is marked derived throughout and must not be read as something
    HUJI published.

    Three further surfaces are real institutional facts but not the institution''s contracts. cris.huji.ac.il
    is a CNAME tenancy — huji.elsevierpure.com then eu.prod.elsevierpure.com — whose live OAI-PMH 2.0
    repository is Elsevier Pure''s engineering (Identify names ''Pure OAI Repository'', adminEmail noreply@atira.dk)
    and whose /ws/api is 401 behind an Elsevier key. Library discovery is a named HUJI scope (972HUJI_INST)
    on the shared Ex Libris Primo host. Crossref carries two HUJI unit memberships and ROR carries the
    institution''s identifier. All four relationships are recorded; none of their vendors'' or registries''
    contracts are saved.

    One candidate was tested and REJECTED. huji.figshare.com returns HTTP 202, which looked like a Figshare
    tenancy until a control probe showed notarealuniversityxyz.figshare.com returns the identical 202
    AWS WAF challenge — the response is wildcard behaviour and proves nothing, so no Figshare relationship
    is claimed. The DataCite providers and clients APIs both return zero results for the university, so
    no DataCite membership is claimed either, despite 2,315 DOIs carrying its ROR as a creator affiliation.

    Absences confirmed rather than assumed: api.huji.ac.il, developer.huji.ac.il, data.huji.ac.il, dataverse.huji.ac.il,
    repository.huji.ac.il, shibboleth.huji.ac.il, idp.huji.ac.il and login.huji.ac.il are all NXDOMAIN.
    There is no open data portal, no developer portal, no API key issuance and no published API documentation
    of any kind. scholars.huji.ac.il now 200s but redirects to the university homepage, so the previous
    profile''s pointer to it has been removed as soft-dead and replaced with cris.huji.ac.il. en.huji.ac.il
    serves 403 to non-browser clients on some paths (llms.txt, .well-known) — a limitation of our probe,
    not of HUJI. Shibboleth is deliberately not claimed: the university runs SimpleSAMLphp, which is SAML
    but is not Shibboleth.'
