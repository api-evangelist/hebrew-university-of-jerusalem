aid: hebrew-university-of-jerusalem
name: Hebrew University of Jerusalem
description: 'The Hebrew University of Jerusalem (HUJI, האוניברסיטה העברית בירושלים) is Israel''s leading
  research university, founded in 1918 and operating campuses in Jerusalem, Rehovot and Eilat across the
  humanities, sciences, medicine, agriculture and law. It publishes no developer portal, no API documentation,
  no API keys and no terms of use for machine access — api.huji.ac.il, developer.huji.ac.il and data.huji.ac.il
  do not resolve at all. What it does operate, on its own infrastructure and without anyone advertising
  it, are two genuinely institution-run programmable surfaces. The first is the JSON API behind Shnaton,
  the official course catalog at shnaton.huji.ac.il: fully public, entirely unauthenticated, bilingual
  Hebrew/English, covering faculties, degree programs, specializations, courses, timetabled study sessions
  and syllabi for academic years 2020 through 2027, with a single unauthenticated search call returning
  the whole 6,355-course catalog in one 14 MB response. The second is the university''s own SAML 2.0 identity
  provider at idp.cc.huji.ac.il, which publishes live machine-readable metadata signed with a certificate
  the institution issued to itself. Both were confirmed institution-operated by IP ownership rather than
  hostname — they resolve inside the 128.139.0.0/16 ILAN allocation registered to IUCC and announced by
  AS378, behind the university''s own load balancers. Beyond those two, the footprint is tenancy: the
  research portal at cris.huji.ac.il is Elsevier Pure (a CNAME to huji.elsevierpure.com) and its working
  OAI-PMH endpoint is Pure''s engineering, and library discovery runs on Ex Libris Primo under institution
  code 972HUJI_INST. Those relationships are recorded here; their vendors'' contracts deliberately are
  not.'
