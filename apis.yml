- aid: hebrew-university-of-jerusalem:cris-pure
  name: HUJI Research Portal / CRIS (Elsevier Pure tenant)
  description: The university's current research information system and research-output portal at cris.huji.ac.il,
    running on Elsevier Pure. It publishes a working OAI-PMH 2.0 repository at /ws/oai which answered
    Identify, ListMetadataFormats (oai_dc, mods, qdc, mods_swepub, xmetadiss, nl_didl, uketd_dc) and ListSets
    (persons:all, publications:all and per-year sets) on 2026-09-01, with an earliest datestamp of 2021-05-27.
    The publications, the researcher profiles and the metadata are the university's; the Identify response
    names 'Pure OAI Repository' with adminEmail noreply@atira.dk, and the Pure API at /ws/api is key-gated
    (401) behind an Elsevier-issued credential. Tenant relationship recorded; the Pure contract is Elsevier's
    and is deliberately not saved here.
