apis:
- aid: hebrew-university-of-jerusalem:shnaton-course-catalog
  name: Shnaton Course Catalog API
  description: 'The public JSON API behind shnaton.huji.ac.il, the Hebrew University''s official course
    catalog. Faculties, departments, degree programs, specializations, study roadmaps, courses, course
    groups, timetabled study sessions and syllabi, bilingual Hebrew/English, for academic years 2020-2027.
    Unauthenticated and unpaginated: an anonymous POST to /courses/search-advanced returned 6,355 courses
    in a single 14,153,560-byte response on 2026-09-01. The university publishes no contract for it —
    the OpenAPI in this repository was derived by API Evangelist from the catalog''s own JavaScript client
    and then verified operation by operation against the production host.'
