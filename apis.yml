- aid: hebrew-university-of-jerusalem:saml-idp
  name: Hebrew University of Jerusalem SAML 2.0 Identity Provider
  description: 'The university''s own SimpleSAMLphp identity provider, publishing a live SAML 2.0 EntityDescriptor
    (HTTP 200, application/xml, 4,548 bytes) with IDPSSODescriptor, HTTP-Redirect SSO and SLO bindings,
    emailAddress NameID format, and signing and encryption key descriptors. The signing certificate is
    self-issued by the institution — O=Hebrew University, OU=The authority for computation,communication
    and information, CN=idp1.cc.huji.ac.il — and it fronts the university''s authenticated estate including
    the Elsevier Pure CRIS. This is the strongest machine-readable contract the institution itself publishes.
    Note: the signing certificate expires 2026-09-22.'
  humanURL: https://idp.cc.huji.ac.il/
  baseURL: https://idp.cc.huji.ac.il/simplesaml/saml2/idp/metadata.php
