aid: hebrew-university-of-jerusalem
name: Hebrew University of Jerusalem
description: >-
  The Hebrew University of Jerusalem (HUJI) is Israel's leading research
  university, ranked #272 in the QS World University Rankings 2025. It operates
  multiple campuses in Jerusalem, Rehovot, and Eilat across the humanities,
  sciences, medicine, and law. HUJI does not publish a dedicated public
  developer portal or documented open API program. Its developer-relevant
  surface is limited to standards-based academic infrastructure: an Ex Libris
  Primo/Alma library discovery system (whose APIs require institution-issued
  keys), the OpenScholar profile/CMS platform, Shibboleth/SAML single sign-on
  (internal/gated), and a number of research-lab open-source GitHub
  organizations. No public, self-service API endpoints were confirmed.
