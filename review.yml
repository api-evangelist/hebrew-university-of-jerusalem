    summary: >-
      No dedicated public developer portal or documented self-service API was
      found for HUJI. Verified live: the official English site, the Library
      Authority site, the OpenScholar platform, and the Ex Libris Primo hosted
      host (all HTTP 200). Library discovery runs on Ex Libris Primo/Alma,
      which has standard APIs/OAI-PMH but requires institution-issued keys and
      is not publicly self-service. SSO is Shibboleth/SAML and internal.
      Several HUJI research labs publish open-source code on GitHub (huji-nlp,
      slp-rl, etc.) but these are code repositories, not institutional REST
      APIs. No endpoints were fabricated; only confirmed properties listed.
